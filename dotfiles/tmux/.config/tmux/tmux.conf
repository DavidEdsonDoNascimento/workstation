# ---------------------------------------------------------------------------
# Prefixo
# ---------------------------------------------------------------------------

# Troca Ctrl+B por Ctrl+A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ---------------------------------------------------------------------------
# Comportamento
# ---------------------------------------------------------------------------

set-option -g mouse on
set-option -g focus-events on
set-option -g history-limit 100000
set-option -g status-interval 5
set-option -g renumber-windows on
set-option -g detach-on-destroy off

# Reduz o atraso ao sair do modo de comandos
set-option -sg escape-time 10

# Numeração iniciando em 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Suporte a cores e clipboard
set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB"
set-option -s set-clipboard on

# ---------------------------------------------------------------------------
# Janelas e painéis
# ---------------------------------------------------------------------------

# Nova janela preservando a pasta atual
bind-key c new-window -c "#{pane_current_path}"

# Divide lado a lado
unbind %
bind-key | split-window -h -c "#{pane_current_path}"

# Divide um painel sobre o outro
unbind '"'
bind-key / split-window -v -c "#{pane_current_path}"

# Navegação entre painéis
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Redimensionamento dos painéis
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Navegação entre janelas
bind-key -r C-h previous-window
bind-key -r C-l next-window

# Recarrega a configuração
bind-key r source-file ~/.config/tmux/tmux.conf \; \
  display-message "Configuração do Tmux recarregada"

# ---------------------------------------------------------------------------
# Modo de cópia
# ---------------------------------------------------------------------------

set-window-option -g mode-keys vi

bind-key [ copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ---------------------------------------------------------------------------
# Barra de status
# ---------------------------------------------------------------------------

set-option -g status on
set-option -g status-position bottom
set-option -g status-style "bg=default,fg=white"

set-option -g status-left-length 50
set-option -g status-right-length 100

set-option -g status-left "#[bold] #S "
set-option -g status-right "#{?client_prefix,#[bold] PREFIX #[default],}#H | %d/%m %H:%M "

set-window-option -g window-status-format " #I:#W "
set-window-option -g window-status-current-format "#[bold] #I:#W* "

set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=colour39"

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

set-option -g @plugin "tmux-plugins/tpm"
set-option -g @plugin "tmux-plugins/tmux-sensible"
set-option -g @plugin "tmux-plugins/tmux-yank"
set-option -g @plugin "tmux-plugins/tmux-resurrect"

# O continuum deve permanecer depois do resurrect.
set-option -g @plugin "tmux-plugins/tmux-continuum"

# Salva a sessão periodicamente e restaura ao iniciar o servidor Tmux.
set-option -g @continuum-save-interval "15"
set-option -g @continuum-restore "on"

# Inicializa o TPM. Esta linha deve permanecer no final.
run-shell "~/.tmux/plugins/tpm/tpm"
